<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F59E0B'><path d='M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z'/></svg>">
    <!-- Social Open Graph & Twitter Cards -->
    <meta property="og:title" content="ReviewBoost - Automated 5-Star Google Reviews for Indian Businesses">
    <meta property="og:description" content="Turn counter footfall into genuine 5-star Google reviews in 15 seconds. Unhappy customers reach management privately.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://ai-google-review-generator-jarvis-def9.vercel.app/static/uploads/artisan_logo.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ReviewBoost - Automated 5-Star Google Reviews for Indian Businesses">
    <meta name="twitter:description" content="Turn counter footfall into genuine 5-star Google reviews in 15 seconds.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Outfit', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        sans: ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#F0F5FF',
                            100: '#E0EBFF',
                            500: '#2563EB',
                            600: '#1D4ED8',
                            700: '#1E40AF',
                            800: '#1E3A8A',
                            900: '#0F172A',
                        },
                        accent: {
                            50: '#FFFBEB',
                            100: '#FEF3C7',
                            400: '#FBBF24',
                            500: '#F59E0B',
                            600: '#D97706',
                            700: '#B45309',
                        },
                        surface: {
                            canvas: '#F8FAFC',
                            subtle: '#F1F5F9',
                            border: '#E2E8F0',
                            card: '#FFFFFF',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Outfit (Headings) + DM Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }
        .touch-manipulation {
            touch-action: manipulation;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }
    </style>
    <meta name="csrf-token" content="{{ get_csrf_token() if get_csrf_token is defined else '' }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased min-h-screen flex flex-col font-sans">
    {% block content %}{% endblock %}

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <script>
        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            if (meta && meta.content) return meta.content;
            const match = document.cookie.match(new RegExp('(^| )rb_csrf_token=([^;]+)'));
            return match ? match[2] : '';
        }

        // Automatic CSRF protection for client-side API requests
        const _nativeFetch = window.fetch;
        window.fetch = function(url, init) {
            init = init || {};
            const method = (init.method || 'GET').toUpperCase();
            if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
                init.headers = init.headers || {};
                const tok = getCsrfToken();
                if (tok) {
                    if (init.headers instanceof Headers) {
                        if (!init.headers.has('x-csrf-token')) init.headers.set('x-csrf-token', tok);
                    } else if (Array.isArray(init.headers)) {
                        init.headers.push(['x-csrf-token', tok]);
                    } else {
                        if (!init.headers['x-csrf-token'] && !init.headers['X-CSRF-Token']) {
                            init.headers['X-CSRF-Token'] = tok;
                        }
                    }
                }
            }
            return _nativeFetch(url, init);
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-slate-800');
            const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle');
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 pointer-events-auto transition-all duration-300 transform translate-y-4 opacity-0 text-sm font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);
            
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>

    <!-- Floating WhatsApp Support Button (Mobile & Desktop Responsive) -->
    <a href="https://wa.me/919876543210?text=Hi%20ReviewBoost%20team%2C%20I%20have%20a%20question%20about%20setting%20up%20QR%20reviews%20for%20my%20business" 
       target="_blank" rel="noopener noreferrer"
       class="fixed bottom-5 left-5 z-40 bg-[#25D366] hover:bg-[#20ba5a] text-white font-bold text-xs px-3.5 py-2.5 rounded-full shadow-lg flex items-center space-x-2 transition-transform hover:scale-105 active:scale-95 border border-white/20" 
       aria-label="Chat with support on WhatsApp">
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span class="hidden sm:inline">WhatsApp Support</span>
    </a>

    {% block scripts %}{% endblock %}
</body>
</html>
