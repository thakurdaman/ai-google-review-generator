{% extends "base.html" %}

{% block title %}Reseller Login - ReviewBoost{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
    <!-- Glow background effect -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-600/20 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    </div>

    <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl relative z-10 text-white">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 shadow-lg shadow-brand-500/30 mb-4 text-2xl font-black">
                <i class="fa-solid fa-star text-amber-300"></i>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight">ReviewBoost Admin</h1>
            <p class="text-sm text-slate-400 mt-1">Agency & Reseller Dashboard</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-medium flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation text-sm"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/admin/login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required value="admin"
                           class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required value="admin123"
                           class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-brand-600/30 transition-all duration-200 flex items-center justify-center space-x-2">
                <span>Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-6 p-3 rounded-xl bg-slate-900/40 border border-slate-700/50 text-center">
            <span class="text-xs text-slate-400">Default Demo Credentials:</span>
            <div class="mt-1 font-mono text-xs text-amber-300">
                admin / admin123
            </div>
        </div>

    </div>
</div>
{% endblock %}
